<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>Casual Arcade · 休闲小游戏合集</title>
  <link rel="stylesheet" href="css/portal.css" />
</head>
<body>
  <div class="portal">
    <aside class="panel side">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>Casual Arcade</h1>
          <p>本地合集门户</p>
        </div>
      </div>
      <div class="cats" id="cats">
        <button class="cat active" data-cat="all"><span>全部游戏</span><small>2</small></button>
        <button class="cat" data-cat="puzzle"><span>益智消除</span><small>1</small></button>
        <button class="cat" data-cat="runner"><span>跑酷射击</span><small>1</small></button>
      </div>
      <div class="footer-note">
        打开方式：仓库根目录执行<br />
        <code>python3 -m http.server 8080</code><br />
        访问 <code>http://localhost:8080</code>
      </div>
    </aside>

    <main class="panel stage">
      <div class="stage-top">
        <div>
          <h2 id="gameTitle">数字门跑酷 · Gate Runner</h2>
          <div class="tags" id="gameTags">
            <span class="tag">Three.js</span>
            <span class="tag">十关战役</span>
            <span class="tag">Quaternius CC0</span>
          </div>
        </div>
        <a class="btn secondary" id="openTab" href="games/gate-runner/" target="_blank" rel="noopener">新标签打开</a>
      </div>
      <div class="playframe">
        <iframe id="play" title="game" src="games/gate-runner/" allow="autoplay; fullscreen"></iframe>
      </div>
      <div class="stage-bottom">
        <div class="hint" id="gameHint">左右拖动变道 · 自动开火打门/僵尸 · 撞门加人/火力</div>
        <div class="actions">
          <button class="btn" id="playSame">玩 SameGame</button>
          <button class="btn secondary" id="playGate">玩 Gate Runner</button>
        </div>
      </div>
    </main>

    <aside class="panel right">
      <h3>推荐</h3>
      <div class="recs">
        <button class="rec" data-game="gate">
          <div class="thumb gate">GR</div>
          <div>
            <b>Gate Runner</b>
            <span>末日高架数字门跑酷。射门改数值，撞门加人，清僵尸。</span>
          </div>
        </button>
        <button class="rec" data-game="same">
          <div class="thumb same">SG</div>
          <div>
            <b>SameGame</b>
            <span>同色连通消除、重力下落、连击倍率。经典益智。</span>
          </div>
        </button>
      </div>
      <div class="footer-note">
        旧根路径 SameGame 已迁至 <code>games/samegame/</code>。<br />
        本门户可直达两款游戏。
      </div>
    </aside>
  </div>
  <script>
    const games = {
      gate: {
        title: '数字门跑酷 · Gate Runner',
        src: 'games/gate-runner/',
        hint: '左右拖动变道 · 自动开火打门/僵尸 · 撞门加人/火力',
        tags: ['Three.js', '十关战役', 'Quaternius CC0'],
        cats: ['all', 'runner']
      },
      same: {
        title: '消灭同色方块 · SameGame',
        src: 'games/samegame/',
        hint: '点选 ≥2 同色连通块消除 · 下落与列压缩 · 冲目标分',
        tags: ['Canvas', '益智', '12 关'],
        cats: ['all', 'puzzle']
      }
    };

    const play = document.getElementById('play');
    const title = document.getElementById('gameTitle');
    const hint = document.getElementById('gameHint');
    const tags = document.getElementById('gameTags');
    const openTab = document.getElementById('openTab');
    let current = 'gate';
    let filter = 'all';

    function setGame(id) {
      const g = games[id];
      if (!g) return;
      current = id;
      play.src = g.src;
      title.textContent = g.title;
      hint.textContent = g.hint;
      openTab.href = g.src;
      tags.innerHTML = g.tags.map(t => `<span class="tag">${t}</span>`).join('');
    }

    document.getElementById('playSame').onclick = () => setGame('same');
    document.getElementById('playGate').onclick = () => setGame('gate');
    document.querySelectorAll('.rec').forEach(el => el.onclick = () => setGame(el.dataset.game));
    document.querySelectorAll('.cat').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.cat').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        filter = el.dataset.cat;
        document.querySelectorAll('.rec').forEach(rec => {
          const g = games[rec.dataset.game];
          rec.style.display = g.cats.includes(filter) ? '' : 'none';
        });
      };
    });

    // Deep link: ?game=samegame|gate-runner
    const q = new URLSearchParams(location.search).get('game');
    if (q === 'samegame' || q === 'same') setGame('same');
    else setGame('gate');
  </script>
</body>
</html>
