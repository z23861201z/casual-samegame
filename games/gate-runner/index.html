<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#87b7ff" />
  <title>数字门跑酷 · Gate Runner</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="hud-row">
        <div class="pill"><span>人数</span><b id="people">3</b></div>
        <div class="pill"><span>火力</span><b id="fire">1</b></div>
        <div class="pill"><span>分数</span><b id="score">0</b></div>
      </div>
      <div class="progress"><i id="prog"></i></div>
      <div class="banner" id="banner">左右拖动 · 自动前进开火</div>
    </div>

    <div id="overlay" class="overlay">
      <div class="card">
        <div class="eyebrow">PR1 竖屏切片</div>
        <h1>向末日开炮</h1>
        <p>自动狂奔 · 射门改数字 · 撞门加人 / 加火力 · 清僵尸</p>
        <button id="btnStart" class="cta">开始关卡 1</button>
        <a class="back" href="../../">← 返回合集门户</a>
      </div>
    </div>

    <div id="settle" class="overlay hidden">
      <div class="card settle">
        <div class="eyebrow" id="settleTitle">关卡结算</div>
        <h1 id="settleResult">胜利</h1>
        <div class="stars" id="stars">★ ★ ★</div>
        <div class="stats">
          <div><span>分数</span><b id="settleScore">0</b></div>
          <div><span>击杀</span><b id="settleKills">0</b></div>
          <div><span>人数</span><b id="settlePeople">0</b></div>
        </div>
        <div class="settle-actions">
          <button id="btnRetry" class="cta">再试一次</button>
          <button id="btnNext" class="cta ghost" disabled title="后续关卡开发中">下一关（未开放）</button>
        </div>
        <a class="back" href="../../">← 返回合集门户</a>
      </div>
    </div>

    <div id="loading" class="overlay">
      <div class="card">
        <div class="eyebrow">加载资源</div>
        <h1>Gate Runner</h1>
        <p id="loadMsg">正在加载 Quaternius glTF…</p>
        <div class="progress"><i id="loadBar" style="width:8%"></i></div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
